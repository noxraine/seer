<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Regime PH</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #000; color: #FFB000;
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      min-height: 100vh;
    }
    body.unstable { background: #1a0000; color: #ffb4b4; }
    .topbar {
      position: sticky; top: 0; z-index: 10; height: 56px; padding: 0 16px;
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid #2A2A2A; background: #000;
    }
    body.unstable .topbar { background: #1a0000; border-bottom-color: #5a2020; }
    .left, .help {
      min-height: 44px; display: flex; align-items: center;
      color: #FFB000; text-decoration: none; letter-spacing: 0.08em; font-size: 14px;
    }
    .left { gap: 8px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #FFB000; }
    .help { min-width: 64px; padding: 0 12px; border: 1px solid #FFB000; justify-content: center; letter-spacing: 0.12em; }
    .screen { display: none; padding-bottom: 28px; }
    .screen.active { display: block; }
    .label { padding: 16px 16px 6px; font-size: 11px; letter-spacing: 0.14em; color: #8A7000; }
    .search-wrap { padding: 8px 16px 4px; }
    .search {
      width: 100%; height: 40px; background: #0a0a0a; border: 1px solid #2A2A2A;
      color: #FFB000; padding: 0 12px; font: inherit; font-size: 14px; outline: none;
    }
    .row {
      width: calc(100% - 32px); margin: 8px auto 0; padding: 12px;
      border: 1px solid #2A2A2A; color: #FFB000; text-decoration: none;
      display: grid; grid-template-columns: 1.2fr 1fr auto; gap: 8px; align-items: center; min-height: 52px;
    }
    .up { color: #3DDC84; }
    .down { color: #FF4D4D; }
    .boards { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 0 16px; }
    .board .row { width: 100%; margin: 8px 0 0; grid-template-columns: 1fr auto; padding: 10px 8px; font-size: 11px; }
    .feed { color: #8A7000; font-size: 11px; letter-spacing: 0.12em; padding: 8px 16px 0; }
    .pair-card { padding: 20px 16px 0; }
    .pair-sym { font-size: 12px; letter-spacing: 0.16em; color: #8A7000; }
    .pair-price { margin-top: 8px; font-size: 42px; line-height: 1; }
    .pair-move { margin-top: 10px; display: flex; gap: 8px; font-size: 16px; }
    .stamp { margin-top: 18px; padding: 14px 12px; border: 1px solid #FFB000; letter-spacing: 0.12em; font-size: 16px; }
    .stamp.normal { border-color: #3DDC84; color: #3DDC84; }
    .stamp.unstable { border-color: #FF4D4D; color: #FF4D4D; background: #2a0000; }
    .stamp.stale { border-color: #FF4D4D; color: #FF4D4D; }
    .warn { margin-top: 10px; font-size: 13px; letter-spacing: 0.08em; color: #FF4D4D; display: none; }
    body.unstable .warn { display: block; }
    .pulse-head { display: flex; align-items: center; gap: 8px; padding: 16px 16px 6px; }
    .pulse-head span { font-size: 11px; letter-spacing: 0.14em; color: #8A7000; }
    .live-dot { width: 6px; height: 6px; border-radius: 50%; background: #FFB000; animation: pulse 2s ease-in-out infinite; }
    body.unstable .live-dot { background: #FF4D4D; }
    @keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
    .log {
      margin: 0 16px;
      border: 1px solid #2A2A2A;
      max-height: 248px;
      overflow: auto;
      background-image: repeating-linear-gradient(0deg, transparent 0, transparent 2px, rgba(255,176,0,0.03) 2px, rgba(255,176,0,0.03) 3px);
    }
    .log-line {
      padding: 8px 12px;
      border-bottom: 1px solid #141414;
      font-size: 12px;
      white-space: nowrap;
      animation: slideIn 0.25s ease-out;
    }
    .log-line .t { color: #5A5A5A; }
    .log-line .k { color: #FFB000; }
    .log-line .v { color: #FFE7A3; }
    .log-line.evt .k, .log-line.evt .v { color: #FF4D4D; }
    .log-line.ok .k { color: #3DDC84; }
    .log-line:nth-child(n+5) { opacity: 0.55; }
    .log-line:nth-child(n+7) { opacity: 0.28; }
    @keyframes slideIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    .live { margin-top: 8px; font-size: 11px; letter-spacing: 0.12em; color: #8A7000; }
    .live.bad { color: #FF4D4D; }
    .access { padding: 28px 16px 0; }
    .access-k { font-size: 11px; letter-spacing: 0.16em; color: #8A7000; }
    .access-days { margin-top: 10px; font-size: 56px; line-height: 1; }
    .btn { display: block; width: 100%; margin-top: 24px; height: 48px; border: 1px solid #FFB000; background: #FFB000; color: #000; font: inherit; letter-spacing: 0.14em; }
    .legal { margin-top: 24px; font-size: 10px; line-height: 1.5; color: #6a5500; }
  </style>
</head>
<body>
  <header class="topbar">
    <a id="leftBtn" class="left" href="#markets"></a>
    <a class="help" href="https://t.me/your_cashier_bot" target="_blank" rel="noopener">HELP</a>
  </header>

  <section id="markets" class="screen">
    <div class="feed" id="feedStatus">FEED · LOADING</div>
    <div class="search-wrap">
      <input id="search" class="search" type="search" placeholder="btc, bitcoin, BTCUSDT" autocomplete="off">
    </div>
    <div class="boards">
      <div class="board"><div class="label">GAINERS 24H</div><div id="gainers"></div></div>
      <div class="board"><div class="label">LOSERS 24H</div><div id="losers"></div></div>
    </div>
    <div class="label" id="listLabel">MARKETS · TOP VOL</div>
    <div id="list"></div>
  </section>

  <section id="pair" class="screen">
    <div class="pair-card">
      <div class="pair-sym" id="pairTitle">BTCUSDT</div>
      <div class="pair-price" id="pairPrice">—</div>
      <div class="pair-move" id="pairMove"></div>
      <div class="live" id="pairLive">LIVE · OFF</div>
      <div class="stamp" id="pairStamp">NORMAL</div>
      <div class="warn">UNSTABLE · DO NOT ADD RISK</div>
      <div class="pulse-head"><i class="live-dot"></i><span>MARKET PULSE</span></div>
      <div class="log" id="pairLog"></div>
    </div>
  </section>

  <section id="access" class="screen">
    <div class="access">
      <div class="access-k">ACCESS</div>
      <div class="access-days" id="daysLeft">30</div>
      <div id="daysLabel">DAYS LEFT</div>
      <button class="btn" id="extendBtn" type="button">EXTEND 30D</button>
      <p class="legal">Not investment advice. Regime describes range and volume versus the last hour. It is not a signal to buy or sell.</p>
    </div>
  </section>

  <script>
    var ALIAS = { BTC:"BTCUSDT", BITCOIN:"BTCUSDT", ETH:"ETHUSDT", ETHEREUM:"ETHUSDT", SOL:"SOLUSDT", SOLANA:"SOLUSDT" };
    var DAY = 86400000, MIN8 = 8 * 60000;
    var CATALOG = [], bars = [], tape = [];
    var busy = false, sock = null, poll = null, openId = "", lastBeat = 0;
    var tapeTimer = null, barTimer = null, watchDog = null;
    var regime = { name: "NORMAL", since: 0 }, prevName = "", lastTapeAt = 0, tapeHold = false, staleOn = false, beat = 0;

    function pad(n) { return ("0" + n).slice(-2); }
    function hhmm(ts) { var d = new Date(ts || Date.now()); return pad(d.getHours()) + ":" + pad(d.getMinutes()); }
    function hhmmss(ts) { var d = new Date(ts || Date.now()); return hhmm(ts) + ":" + pad(d.getSeconds()); }
    function onlineNow() { return navigator.onLine !== false; }
    function setFeed(t) { document.getElementById("feedStatus").textContent = t; }
    function setLive(t, bad) {
      var el = document.getElementById("pairLive");
      el.textContent = t; el.className = bad ? "live bad" : "live";
    }
    function fmt(n) { return (n > 0 ? "+" : "") + Number(n).toFixed(2) + "%"; }
    function chgClass(n) { return n >= 0 ? "up" : "down"; }
    function nicePx(x) {
      var n = Number(x);
      if (!isFinite(n)) return "—";
      if (n >= 1000) return n.toFixed(2);
      if (n >= 1) return n.toFixed(3);
      return n.toFixed(5);
    }
    function median(a) {
      var b = a.slice().sort(function (x, y) { return x - y; });
      return b.length ? b[Math.floor(b.length / 2)] : 0;
    }
    function atr14(list, end) {
      if (end < 14) return 0;
      var s = 0;
      for (var i = end - 13; i <= end; i++) {
        var prev = list[i - 1].c;
        s += Math.max(list[i].h - list[i].l, Math.abs(list[i].h - prev), Math.abs(list[i].l - prev));
      }
      return s / 14;
    }
    function metrics(list, end) {
      var atr = atr14(list, end);
      if (!atr || end < 20) return { S: 0, R: 0, roc: 0, Q: 1, atr: 0 };
      var R = (list[end].h - list[end].l) / atr;
      var roc = Math.abs(list[end].c - list[end - 5].c) / atr;
      var vols = [];
      for (var i = end - 20; i < end; i++) vols.push(list[i].v);
      var med = median(vols);
      var Q = med ? list[end].v / med : 1;
      return { S: (R > 2.2 ? 1 : 0) + (roc > 1.8 ? 1 : 0) + (Q > 3 ? 1 : 0), R: R, roc: roc, Q: Q, atr: atr };
    }
    function replay(list) {
      var state = "NORMAL", since = list[20] ? list[20].t : Date.now(), lastFlip = 0, calm = 0, prevS = 0;
      for (var i = 21; i < list.length; i++) {
        var m = metrics(list, i), t = list[i].t;
        if (state === "NORMAL") {
          if (m.S >= 2 && prevS >= 2 && (t - lastFlip) >= MIN8) { state = "UNSTABLE"; since = t; lastFlip = t; calm = 0; }
        } else {
          calm = (m.S === 0 && m.R < 0.8 && m.Q < 1.5) ? calm + 1 : 0;
          if (calm >= 10 && (t - since) >= MIN8) { state = "NORMAL"; since = t; lastFlip = t; calm = 0; }
        }
        prevS = m.S;
      }
      return { name: state, since: since };
    }
    function paintRegime() {
      var el = document.getElementById("pairStamp");
      document.body.classList.toggle("unstable", regime.name === "UNSTABLE" && !staleOn);
      if (staleOn) { el.textContent = "STALE · NO LIVE DATA"; el.className = "stamp stale"; return; }
      el.textContent = regime.name + " · SINCE " + hhmm(regime.since);
      el.className = "stamp " + regime.name.toLowerCase();
    }
    function findPair(id) {
      for (var i = 0; i < CATALOG.length; i++) if (CATALOG[i].id === id) return CATALOG[i];
      return { id: id || "BTCUSDT", px: "—", chg: 0, vol: 0 };
    }
    function rowHtml(p) {
      return '<a class="row" href="#pair/' + p.id + '"><span>' + p.id + '</span><span>' + p.px + '</span><span class="' + chgClass(p.chg) + '">' + fmt(p.chg) + '</span></a>';
    }
    function norm(q) { return String(q || "").toUpperCase().replace(/[^A-Z0-9]/g, ""); }
    function draw() {
      var q = norm(document.getElementById("search").value);
      var ranked = CATALOG.slice().sort(function (a, b) { return b.chg - a.chg; });
      document.getElementById("gainers").innerHTML = ranked.slice(0, 5).map(rowHtml).join("");
      document.getElementById("losers").innerHTML = ranked.slice(-5).reverse().map(rowHtml).join("");
      var rows = q ? CATALOG.filter(function (p) { return p.id.indexOf(q) !== -1 || ALIAS[q] === p.id; }).slice(0, 40)
        : CATALOG.slice().sort(function (a, b) { return b.vol - a.vol; }).slice(0, 30);
      document.getElementById("listLabel").textContent = q ? "SEARCH" : "MARKETS · TOP VOL";
      document.getElementById("list").innerHTML = rows.map(rowHtml).join("") || '<p class="label">NO MATCH</p>';
    }
    function paintPair(p) {
      document.getElementById("pairTitle").textContent = p.id;
      document.getElementById("pairPrice").textContent = p.px;
      document.getElementById("pairMove").innerHTML = '<span class="' + chgClass(p.chg) + '">' + (p.chg >= 0 ? "▲" : "▼") + '</span><span class="' + chgClass(p.chg) + '">' + fmt(p.chg) + " 24H</span>";
    }
    function line(kind, text, cls) {
      return { kind: kind, html: text, cls: cls || "" };
    }
    function renderTape() {
      var box = document.getElementById("pairLog");
      var view = tape.slice(-8);
      box.innerHTML = view.map(function (row) { return '<div class="log-line ' + row.cls + '">' + row.html + "</div>"; }).join("");
      if (!tapeHold) box.scrollTop = box.scrollHeight;
    }
    function pushTape(row, force) {
      var now = Date.now();
      if (!force && now - lastTapeAt < 5000) return;
      lastTapeAt = now;
      tape.push(row);
      if (tape.length > 20) tape = tape.slice(-20);
      renderTape();
    }
    function fact(m, sym) {
      var t = '<span class="t">' + hhmmss() + "</span> ";
      var hold = Math.max(1, Math.round((Date.now() - regime.since) / 60000));
      var snaps = [
        t + '<span class="k">' + sym + "</span> <span class=\"v\">" + regime.name + "</span> <span class=\"k\">ATR</span> <span class=\"v\">" + m.atr.toPrecision(3) + "</span>",
        t + '<span class="k">VOL</span> <span class="v">Q=' + m.Q.toFixed(1) + "</span>",
        t + '<span class="k">RANGE</span> <span class="v">' + m.R.toFixed(2) + "</span> <span class=\"k\">ATR</span>",
        t + '<span class="k">ROC5</span> <span class="v">' + m.roc.toFixed(2) + "</span>",
        t + '<span class="k">HOLD</span> <span class="v">' + hold + "m</span> <span class=\"k\">" + regime.name + "</span>"
      ];
      return snaps[beat % snaps.length];
    }
    function seedTape(list, sym) {
      tape = [];
      var idx = [28, 36, 44, 52, list.length - 1];
      for (var i = 0; i < idx.length; i++) {
        var n = Math.min(list.length - 1, idx[i]);
        var m = metrics(list, n);
        tape.push(line("hist", '<span class="t">' + hhmmss(list[n].t) + '</span> <span class="k">S</span> <span class="v">' + m.S + '</span> <span class="k">Q</span> <span class="v">' + m.Q.toFixed(1) + "</span>"));
      }
      tape.push(line("evt", '<span class="t">' + hhmmss(regime.since) + '</span> <span class="k">' + regime.name + "</span>", regime.name === "UNSTABLE" ? "evt" : "ok"));
      renderTape();
    }
    function onRegime(sym) {
      if (prevName && prevName !== regime.name) {
        pushTape(line("evt", '<span class="t">' + hhmmss() + '</span> <span class="k">' + sym + " " + regime.name + "</span> <span class=\"v\">SINCE " + hhmm(regime.since) + "</span>", regime.name === "UNSTABLE" ? "evt" : "ok"), true);
      }
      prevName = regime.name;
    }
    function loadBars(id) {
      fetch("https://data-api.binance.vision/api/v3/klines?symbol=" + id + "&interval=1m&limit=60")
        .then(function (r) { if (!r.ok) throw new Error("bad"); return r.json(); })
        .then(function (rows) {
          if (openId !== id) return;
          var next = rows.map(function (k) { return { t: k[0], h: +k[2], l: +k[3], c: +k[4], v: +k[5] }; });
          var first = !bars.length;
          bars = next;
          regime = replay(bars);
          paintRegime();
          if (first) seedTape(bars, id.replace("USDT", ""));
          onRegime(id.replace("USDT", ""));
          var m = metrics(bars, bars.length - 1);
          if (m.Q > 2 || m.R > 1.5) pushTape(line("hot", '<span class="t">' + hhmmss() + '</span> <span class="k">WATCH</span> <span class="v">Q=' + m.Q.toFixed(1) + " R=" + m.R.toFixed(2) + "</span>"), false);
        })
        .catch(function () { if (openId === id) { staleOn = true; paintRegime(); } });
    }
    function stopLive() {
      openId = "";
      if (poll) clearInterval(poll);
      if (barTimer) clearInterval(barTimer);
      if (tapeTimer) clearInterval(tapeTimer);
      if (watchDog) clearInterval(watchDog);
      poll = barTimer = tapeTimer = watchDog = null;
      if (sock) { try { sock.onclose = null; sock.close(); } catch (e) {} sock = null; }
      document.body.classList.remove("unstable");
    }
    function markStale() { staleOn = true; setLive("STALE · NO LIVE DATA", true); paintRegime(); }
    function markLive(how, id) { staleOn = false; setLive("LIVE · " + how + " " + id, false); lastBeat = Date.now(); paintRegime(); }
    function restOne(id) {
      if (!onlineNow()) return markStale();
      fetch("https://data-api.binance.vision/api/v3/ticker/24hr?symbol=" + id)
        .then(function (r) { if (!r.ok) throw new Error("bad"); return r.json(); })
        .then(function (row) {
          if (openId !== id) return;
          var p = findPair(id);
          p.px = nicePx(row.lastPrice); p.chg = Number(row.priceChangePercent) || 0;
          paintPair(p); markLive("REST", id);
        }).catch(function () { if (openId === id) markStale(); });
    }
    function startLive(id) {
      stopLive();
      openId = id; bars = []; tape = []; staleOn = false; prevName = ""; beat = 0;
      paintPair(findPair(id));
      regime = { name: "NORMAL", since: Date.now() };
      paintRegime();
      if (!onlineNow()) return markStale();
      setLive("LIVE · CONNECTING", false);
      lastBeat = Date.now();
      loadBars(id);
      barTimer = setInterval(function () { if (openId === id) loadBars(id); }, 8000);
      tapeTimer = setInterval(function () {
        if (openId !== id || !bars.length || staleOn) return;
        var m = metrics(bars, bars.length - 1);
        pushTape(line("beat", fact(m, id.replace("USDT", ""))), false);
        beat++;
      }, 12000);
      try { sock = new WebSocket("wss://data-stream.binance.vision/ws/" + id.toLowerCase() + "@miniTicker"); }
      catch (e) { restOne(id); poll = setInterval(function () { if (openId === id) restOne(id); }, 3000); return; }
      sock.onmessage = function (ev) {
        if (openId !== id) return;
        var msg = JSON.parse(ev.data), p = findPair(id);
        p.px = nicePx(msg.c); paintPair(p); markLive("SOCKET", id);
      };
      sock.onerror = function () {};
      sock.onclose = function () {
        sock = null;
        if (openId !== id) return;
        restOne(id);
        if (!poll) poll = setInterval(function () { if (openId === id) restOne(id); }, 3000);
      };
      watchDog = setInterval(function () {
        if (openId === id && (!onlineNow() || Date.now() - lastBeat > 12000)) markStale();
      }, 2000);
    }
    function isSpot(sym) {
      return sym && sym.slice(-4) === "USDT" && sym.indexOf("UP") < 0 && sym.indexOf("DOWN") < 0 && sym.indexOf("BULL") < 0 && sym.indexOf("BEAR") < 0;
    }
    function loadPrices() {
      if (busy || !onlineNow()) { if (!onlineNow()) setFeed("FEED DELAYED"); return; }
      busy = true;
      fetch("https://data-api.binance.vision/api/v3/ticker/24hr")
        .then(function (r) { if (!r.ok) throw new Error("bad"); return r.json(); })
        .then(function (rows) {
          CATALOG = [];
          for (var i = 0; i < rows.length; i++) {
            if (!isSpot(rows[i].symbol)) continue;
            CATALOG.push({ id: rows[i].symbol, px: nicePx(rows[i].lastPrice), chg: Number(rows[i].priceChangePercent) || 0, vol: Number(rows[i].quoteVolume) || 0 });
          }
          setFeed("FEED · " + CATALOG.length + " USDT");
          draw();
        }).catch(function () { setFeed("FEED DELAYED"); }).then(function () { busy = false; });
    }
    function drawAccess() {
      var n = parseInt(localStorage.getItem("accessUntil") || "0", 10);
      if (!n) { n = Date.now() + 30 * DAY; localStorage.setItem("accessUntil", String(n)); }
      var d = Math.max(0, Math.ceil((n - Date.now()) / DAY));
      document.getElementById("daysLeft").textContent = d;
      document.getElementById("daysLabel").textContent = d === 1 ? "DAY LEFT" : "DAYS LEFT";
    }
    function show(name, pairId) {
      document.querySelectorAll(".screen").forEach(function (el) { el.classList.toggle("active", el.id === name); });
      var left = document.getElementById("leftBtn");
      if (name === "markets") { left.href = "#access"; left.innerHTML = '<span class="dot"></span>TRIAL'; stopLive(); }
      else { left.href = "#markets"; left.textContent = "←"; }
      if (name === "pair") startLive(pairId || "BTCUSDT");
      if (name === "access") { stopLive(); drawAccess(); }
    }
    function route() {
      var hash = location.hash || "#markets";
      if (hash.indexOf("#pair") === 0) show("pair", hash.split("/")[1] || "BTCUSDT");
      else if (hash === "#access") show("access");
      else show("markets");
    }
    var logEl = document.getElementById("pairLog");
    logEl.addEventListener("touchstart", function () { tapeHold = true; });
    logEl.addEventListener("touchend", function () { setTimeout(function () { tapeHold = false; }, 4000); });
    document.getElementById("search").addEventListener("input", draw);
    document.getElementById("extendBtn").addEventListener("click", function () {
      var n = parseInt(localStorage.getItem("accessUntil") || "0", 10) || Date.now();
      localStorage.setItem("accessUntil", String(Math.max(n, Date.now()) + 30 * DAY));
      drawAccess();
    });
    window.addEventListener("offline", markStale);
    window.addEventListener("online", function () {
      loadPrices();
      if ((location.hash || "").indexOf("#pair") === 0) startLive(location.hash.split("/")[1] || "BTCUSDT");
    });
    document.addEventListener("visibilitychange", function () {
      if (document.hidden) { if (openId) markStale(); stopLive(); }
      else if ((location.hash || "").indexOf("#pair") === 0) startLive(location.hash.split("/")[1] || "BTCUSDT");
      else loadPrices();
    });
    draw();
    loadPrices();
    setInterval(loadPrices, 20000);
    window.addEventListener("hashchange", route);
    route();
  </script>
</body>
</html>
