<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Regime PH</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #000;
      color: #FFB000;
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      min-height: 100vh;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      height: 56px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #2A2A2A;
      background: #000;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 44px;
      padding: 0 4px;
      color: #FFB000;
      text-decoration: none;
      letter-spacing: 0.08em;
      font-size: 14px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #FFB000;
      flex-shrink: 0;
    }

    .help {
      min-height: 44px;
      min-width: 64px;
      padding: 0 12px;
      border: 1px solid #FFB000;
      background: transparent;
      color: #FFB000;
      font: inherit;
      font-size: 14px;
      letter-spacing: 0.12em;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .screen {
      min-height: calc(100vh - 56px);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    h1 {
      color: #FFB000;
      font-size: 2rem;
      letter-spacing: 0.2em;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="status" href="#access">
      <span class="dot"></span>
      TRIAL
    </a>
    <a class="help" href="https://t.me/your_cashier_bot" target="_blank" rel="noopener">
      HELP
    </a>
  </header>

  <main class="screen">
    <h1>MARKETS</h1>
  </main>
</body>
</html>
