<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Regime PH</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #000; color: #e0a040; font-family: ui-monospace, monospace; }
    #app {
      min-height: 100%; max-width: 420px; margin: 0 auto; padding: 24px;
      display: flex; flex-direction: column; background: #000;
      transition: background-color 640ms cubic-bezier(0.4, 0, 0.2, 1);
    }
    #app.shock-in { transition: background-color 140ms linear; background: #8f1212; }
    #app.shock-hold { transition: none; background: #6e1010; }
    #app.shock-out { transition: background-color 640ms cubic-bezier(0.4, 0, 0.2, 1); background: #000; }
    .slogans { position: relative; height: 72px; margin-top: 12px; }
    .phrase {
      position: absolute; inset: 0; text-align: center; font-size: 22px; line-height: 1.35;
      transition: opacity 420ms cubic-bezier(0.22, 1, 0.36, 1), transform 420ms cubic-bezier(0.22, 1, 0.36, 1), filter 420ms cubic-bezier(0.22, 1, 0.36, 1);
    }
    .phrase.off { opacity: 0; transform: translateY(-6px); filter: blur(4px); }
    .phrase.on { opacity: 1; transform: translateY(0); filter: blur(0); }
    .phrase.enter { opacity: 0; transform: translateY(8px); filter: blur(6px); transition-duration: 560ms; transition-delay: 80ms; }
    .phrase span { display: inline-block; opacity: 0; transform: translateY(8px); filter: blur(6px); }
    .phrase.on span { animation: word 560ms cubic-bezier(0.22, 1, 0.36, 1) forwards; }
    @keyframes word { to { opacity: 1; transform: none; filter: none; } }
    .rule { position: absolute; left: 50%; bottom: 0; height: 1px; width: 0; background: #e0a040; transform: translateX(-50%); }
    .rule.run { animation: rule 2400ms linear; }
    @keyframes rule { 0% { width: 0; } 35% { width: 28%; } 100% { width: 18%; } }
    .chart-wrap { flex: 1; min-height: 220px; display: flex; align-items: flex-end; }
    canvas { width: 100%; height: 46vh; max-height: 280px; display: block; }
    .badge { position: relative; margin-top: 18px; min-height: 62px; text-align: center; overflow: hidden; }
    .badge-line { position: absolute; left: 0; top: 0; height: 2px; width: 0; background: #ff3b30; }
    .badge-line.go { animation: sweep 140ms linear forwards; }
    @keyframes sweep { to { width: 100%; } }
    .mode { font-size: 28px; letter-spacing: 0.12em; }
    .mode.leave { animation: up 420ms cubic-bezier(0.22, 1, 0.36, 1) forwards; }
    .mode.come { animation: down 560ms 80ms cubic-bezier(0.22, 1, 0.36, 1) both; }
    @keyframes up { to { opacity: 0; transform: translateY(-6px); filter: blur(4px); } }
    @keyframes down { from { opacity: 0; transform: translateY(8px); filter: blur(6px); } to { opacity: 1; transform: none; filter: none; } }
    .risk { margin-top: 6px; font-size: 13px; color: #f2f2f2; letter-spacing: 0.06em; }
    button {
      margin-top: auto; height: 48px; background: #000; color: #e0a040;
      border: 1px solid #e0a040; font: inherit; letter-spacing: 0.14em;
    }
    #app.shock-hold button, #app.shock-in button { background: transparent; }
  </style>
</head>
<body>
  <div id="app">
    <div class="slogans">
      <div class="phrase on" id="phrase"></div>
      <i class="rule" id="rule"></i>
    </div>
    <div class="chart-wrap"><canvas id="chart"></canvas></div>
    <div class="badge">
      <i class="badge-line" id="badgeLine"></i>
      <div class="mode" id="mode">NORMAL</div>
      <div class="risk" id="risk"></div>
    </div>
    <button id="go" type="button">TRY ON BTC</button>
  </div>
  <script>
    if (localStorage.getItem("regime-onboarded") === "1") {
      document.getElementById("app").remove();
    } else {
      var LINES = [
        "Your plan breaks in the shock.",
        "We flag the shock. Nothing else.",
        "No buy. No sell.",
        "We tell you when not to."
      ];
      var DELTAS = [0.012, 0.008, 0.015, 0.006, 0.011, 0.009, 0.014, 0.007, -0.045, -0.062, -0.038, -0.028, 0.030, 0.022, 0.018, 0.012];
      var phrase = document.getElementById("phrase");
      var rule = document.getElementById("rule");
      var lineI = 0;
      function showLine(i) {
        var words = LINES[i].split(" ");
        phrase.className = "phrase enter";
        phrase.innerHTML = words.map(function (w, n) {
          return '<span style="animation-delay:' + (n * 40) + 'ms">' + w + "</span>";
        }).join(" ");
        rule.className = "rule";
        void phrase.offsetWidth;
        phrase.className = "phrase on";
        rule.className = "rule run";
        setTimeout(function () { phrase.className = "phrase on off"; }, 2400);
      }
      showLine(0);
      setInterval(function () { lineI = (lineI + 1) % LINES.length; showLine(lineI); }, 2900);

      var canvas = document.getElementById("chart");
      var ctx = canvas.getContext("2d");
      var candles = [];
      var close = 0.55;
      var di = 0;
      for (var i = 0; i < 18; i++) {
        var open = close;
        close = open + DELTAS[di % 16];
        candles.push({ open: open, close: close, phase: di % 16 < 8 ? "calm" : di % 16 < 12 ? "shock" : "back" });
        di++;
      }
      var shift = 0, last = performance.now(), shockOn = false;
      function phaseOf(n) { return n < 8 ? "calm" : n < 12 ? "shock" : "back"; }
      function resize() {
        var r = canvas.getBoundingClientRect();
        canvas.width = Math.max(1, r.width * devicePixelRatio);
        canvas.height = Math.max(1, r.height * devicePixelRatio);
      }
      function paintBadge(phase, edge) {
        var mode = document.getElementById("mode");
        var risk = document.getElementById("risk");
        var app = document.getElementById("app");
        var line = document.getElementById("badgeLine");
        if (phase === "shock" && !shockOn) {
          shockOn = true;
          app.className = "shock-in";
          line.className = "badge-line go";
          mode.textContent = "SHOCK";
          mode.style.color = "#ff3b30";
          mode.className = "mode come";
          risk.textContent = "Do not add risk";
          setTimeout(function () { if (shockOn) app.className = "shock-hold"; }, 140);
        } else if (phase !== "shock" && shockOn && edge) {
          shockOn = false;
          app.className = "shock-out";
          mode.className = "mode leave";
          setTimeout(function () {
            mode.textContent = "NORMAL";
            mode.style.color = "#e0a040";
            mode.className = "mode come";
            risk.textContent = "";
            line.className = "badge-line";
          }, 200);
        }
      }
      function frame(now) {
        var dt = Math.min(48, now - last);
        last = now;
        shift += dt / 480;
        if (shift >= 1) {
          shift -= 1;
          var open = candles[candles.length - 1].close;
          var n = di % 16;
          var next = open + DELTAS[n];
          candles.push({ open: open, close: next, phase: phaseOf(n) });
          di++;
          if (candles.length > 19) candles.shift();
          paintBadge(candles[candles.length - 1].phase, true);
        }
        resize();
        var w = canvas.width, h = canvas.height, step = w / 18, body = step * 0.7;
        ctx.clearRect(0, 0, w, h);
        var x0 = -shift * step;
        for (var c = 0; c < candles.length; c++) {
          var cd = candles[c];
          var y1 = (1 - cd.open) * h, y2 = (1 - cd.close) * h;
          ctx.fillStyle = cd.close >= cd.open ? "#e0a040" : "#ff3b30";
          ctx.fillRect(x0 + c * step + (step - body) / 2, Math.min(y1, y2), body, Math.max(2, Math.abs(y2 - y1)));
        }
        requestAnimationFrame(frame);
      }
      paintBadge(candles[candles.length - 1].phase, true);
      requestAnimationFrame(frame);
      document.getElementById("go").addEventListener("click", function () {
        localStorage.setItem("regime-onboarded", "1");
        document.getElementById("app").remove();
      });
    }
  </script>
</body>
</html>
