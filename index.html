<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Regime PH</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #000;
      color: #FFB000;
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      min-height: 100vh;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      height: 56px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #2A2A2A;
      background: #000;
    }

    .left, .help {
      min-height: 44px;
      display: flex;
      align-items: center;
      color: #FFB000;
      text-decoration: none;
      letter-spacing: 0.08em;
      font-size: 14px;
    }

    .left { gap: 8px; padding-right: 12px; }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #FFB000;
    }

    .help {
      min-width: 64px;
      padding: 0 12px;
      border: 1px solid #FFB000;
      justify-content: center;
      letter-spacing: 0.12em;
    }

    .screen { display: none; min-height: calc(100vh - 56px); }
    .screen.active { display: block; }

    .center {
      min-height: calc(100vh - 56px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
    }

    h1 {
      font-size: 1.6rem;
      letter-spacing: 0.2em;
    }

    .hint {
      color: #8A7000;
      font-size: 12px;
      letter-spacing: 0.08em;
    }

    .row {
      width: calc(100% - 32px);
      margin: 16px auto 0;
      padding: 16px;
      border: 1px solid #2A2A2A;
      color: #FFB000;
      text-decoration: none;
      display: flex;
      justify-content: space-between;
      min-height: 52px;
      letter-spacing: 0.06em;
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a id="leftBtn" class="left" href="#markets"></a>
    <a class="help" href="https://t.me/your_cashier_bot" target="_blank" rel="noopener">HELP</a>
  </header>

  <section id="markets" class="screen">
    <div class="center">
      <h1>MARKETS</h1>
      <p class="hint">DAY 3 · EMPTY LIST</p>
    </div>
    <a class="row" href="#pair">
      <span>BTCUSDT</span>
      <span>OPEN</span>
    </a>
  </section>

  <section id="pair" class="screen">
    <div class="center">
      <h1>BTCUSDT</h1>
      <p class="hint">DAY 3 · EMPTY PAIR</p>
    </div>
  </section>

  <section id="access" class="screen">
    <div class="center">
      <h1>ACCESS</h1>
      <p class="hint">DAY 3 · EMPTY TICKET</p>
    </div>
  </section>

  <script>
    function show(name) {
      document.querySelectorAll(".screen").forEach(function (el) {
        el.classList.toggle("active", el.id === name);
      });

      var left = document.getElementById("leftBtn");
      if (name === "markets") {
        left.href = "#access";
        left.innerHTML = '<span class="dot"></span>TRIAL';
      } else {
        left.href = "#markets";
        left.textContent = "←";
      }
    }

    function route() {
      var name = (location.hash || "#markets").slice(1);
      if (name !== "markets" && name !== "pair" && name !== "access") name = "markets";
      show(name);
    }

    window.addEventListener("hashchange", route);
    route();
  </script>
</body>
</html>
