<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Regime PH</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #000;
      color: #FFB000;
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      min-height: 100vh;
    }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      height: 56px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #2A2A2A;
      background: #000;
    }
    .left, .help {
      min-height: 44px;
      display: flex;
      align-items: center;
      color: #FFB000;
      text-decoration: none;
      letter-spacing: 0.08em;
      font-size: 14px;
    }
    .left { gap: 8px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #FFB000; }
    .help {
      min-width: 64px;
      padding: 0 12px;
      border: 1px solid #FFB000;
      justify-content: center;
      letter-spacing: 0.12em;
    }
    .screen { display: none; }
    .screen.active { display: block; }
    .search-wrap { padding: 12px 16px 8px; }
    .search {
      width: 100%;
      height: 40px;
      background: #0a0a0a;
      border: 1px solid #2A2A2A;
      color: #FFB000;
      padding: 0 12px;
      font: inherit;
      font-size: 14px;
      outline: none;
    }
    .search::placeholder { color: #6a5500; }
    .row {
      width: calc(100% - 32px);
      margin: 8px auto 0;
      padding: 14px 16px;
      border: 1px solid #2A2A2A;
      color: #FFB000;
      text-decoration: none;
      display: grid;
      grid-template-columns: 1.2fr 1fr auto;
      gap: 12px;
      align-items: center;
      min-height: 52px;
    }
    .up { color: #3DDC84; }
    .down { color: #FF4D4D; }
    .center {
      min-height: calc(100vh - 56px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }
    .hint { color: #8A7000; font-size: 12px; letter-spacing: 0.08em; }
  </style>
</head>
<body>
  <header class="topbar">
    <a id="leftBtn" class="left" href="#markets"></a>
    <a class="help" href="https://t.me/your_cashier_bot" target="_blank" rel="noopener">HELP</a>
  </header>

  <section id="markets" class="screen">
    <div style="padding:12px 16px 8px;">
      <input id="search" class="search" type="search" placeholder="Search BTC, ETH, SOL…" autocomplete="off">
    </div>
    <div id="list"></div>
  </section>

  <section id="pair" class="screen">
    <div class="center">
      <h1 id="pairTitle">BTCUSDT</h1>
      <p class="hint">DAY 4 · TAP BACK TO LIST</p>
    </div>
  </section>

  <section id="access" class="screen">
    <div class="center">
      <h1>ACCESS</h1>
      <p class="hint">DAY 4 · TICKET SCREEN</p>
    </div>
  </section>

  <script>
    var PAIRS = [
      { id: "BTCUSDT", px: "97241.20", chg: "+1.24", up: true },
      { id: "ETHUSDT", px: "3521.80", chg: "-0.62", up: false },
      { id: "SOLUSDT", px: "178.45", chg: "+3.11", up: true },
      { id: "BNBUSDT", px: "612.30", chg: "+0.44", up: true },
      { id: "XRPUSDT", px: "2.184", chg: "-1.08", up: false },
      { id: "ADAUSDT", px: "0.842", chg: "+0.91", up: true },
      { id: "DOGEUSDT", px: "0.168", chg: "-2.35", up: false },
      { id: "AVAXUSDT", px: "38.12", chg: "+1.77", up: true },
      { id: "LINKUSDT", px: "18.40", chg: "+0.28", up: true },
      { id: "DOTUSDT", px: "6.21", chg: "-0.54", up: false }
    ];

    function renderList(filter) {
      var q = (filter || "").trim().toUpperCase();
      var root = document.getElementById("list");
      var html = "";
      PAIRS.forEach(function (p) {
        if (q && p.id.indexOf(q) === -1) return;
        html += '<a class="row" href="#pair">' +
          '<span>' + p.id + '</span>' +
          '<span>' + p.px + '</span>' +
          '<span class="' + (p.up ? "up" : "down") + '">' + p.chg + '%</span></a>';
      });
      root.innerHTML = html || '<p class="hint" style="padding:16px;">NO MATCH</p>';
    }

    function show(name) {
      document.querySelectorAll(".screen").forEach(function (el) {
        el.classList.toggle("active", el.id === name);
      });
      var left = document.getElementById("leftBtn");
      if (name === "markets") {
        left.href = "#access";
        left.innerHTML = '<span class="dot"></span>TRIAL';
      } else {
        left.href = "#markets";
        left.textContent = "←";
      }
    }

    function route() {
      var name = (location.hash || "#markets").slice(1);
      if (name !== "markets" && name !== "pair" && name !== "access") name = "markets";
      show(name);
    }

    window.addEventListener("hashchange", route);
    document.getElementById("search").addEventListener("input", function () {
      renderList(this.value);
    });
    renderList("");
    route();
  </script>
</body>
</html>
