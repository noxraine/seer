<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Regime PH</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #000;
      color: #FFB000;
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      min-height: 100vh;
    }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      height: 56px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #2A2A2A;
      background: #000;
    }
    .left, .help {
      min-height: 44px;
      display: flex;
      align-items: center;
      color: #FFB000;
      text-decoration: none;
      letter-spacing: 0.08em;
      font-size: 14px;
    }
    .left { gap: 8px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #FFB000; }
    .help {
      min-width: 64px;
      padding: 0 12px;
      border: 1px solid #FFB000;
      justify-content: center;
      letter-spacing: 0.12em;
    }
    .screen { display: none; padding-bottom: 28px; }
    .screen.active { display: block; }
    .label {
      padding: 16px 16px 6px;
      font-size: 11px;
      letter-spacing: 0.14em;
      color: #8A7000;
    }
    .empty {
      margin: 8px 16px 0;
      padding: 14px;
      border: 1px dashed #2A2A2A;
      color: #8A7000;
      font-size: 12px;
      letter-spacing: 0.08em;
    }
    .search-wrap { padding: 8px 16px 4px; }
    .search {
      width: 100%;
      height: 40px;
      background: #0a0a0a;
      border: 1px solid #2A2A2A;
      color: #FFB000;
      padding: 0 12px;
      font: inherit;
      font-size: 14px;
      outline: none;
    }
    .search::placeholder { color: #6a5500; }
    .row {
      width: calc(100% - 32px);
      margin: 8px auto 0;
      padding: 12px 12px 12px 8px;
      border: 1px solid #2A2A2A;
      color: #FFB000;
      text-decoration: none;
      display: grid;
      grid-template-columns: 28px 1.15fr 1fr auto;
      gap: 8px;
      align-items: center;
      min-height: 52px;
    }
    .star {
      border: 0;
      background: transparent;
      color: #5a4500;
      font-size: 18px;
      line-height: 1;
      width: 28px;
      height: 28px;
      cursor: pointer;
    }
    .star.on { color: #FFB000; }
    .up { color: #3DDC84; }
    .down { color: #FF4D4D; }
    .boards {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      padding: 0 16px;
    }
    .board { min-width: 0; }
    .board .row {
      width: 100%;
      margin: 8px 0 0;
      grid-template-columns: 1fr auto;
      padding: 10px 8px;
      font-size: 11px;
    }
    .hint { color: #8A7000; font-size: 12px; letter-spacing: 0.08em; }
    .center {
      min-height: calc(100vh - 56px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a id="leftBtn" class="left" href="#markets"></a>
    <a class="help" href="https://t.me/your_cashier_bot" target="_blank" rel="noopener">HELP</a>
  </header>

  <section id="markets" class="screen">
    <div class="label">WATCHLIST</div>
    <div id="watch"></div>
    <div class="search-wrap">
      <input id="search" class="search" type="search" placeholder="Search BTC, ETH, SOL…" autocomplete="off">
    </div>
    <div class="boards">
      <div class="board">
        <div class="label">GAINERS 24H</div>
        <div id="gainers"></div>
      </div>
      <div class="board">
        <div class="label">LOSERS 24H</div>
        <div id="losers"></div>
      </div>
    </div>
    <div class="label">MARKETS</div>
    <div id="list"></div>
  </section>

  <section id="pair" class="screen">
    <div class="center">
      <h1 id="pairTitle">BTCUSDT</h1>
      <p class="hint">DAY 5 · TAP BACK TO LIST</p>
    </div>
  </section>

  <section id="access" class="screen">
    <div class="center">
      <h1>ACCESS</h1>
      <p class="hint">DAY 5 · TICKET SCREEN</p>
    </div>
  </section>

  <script>
    var PAIRS = [
      { id: "BTCUSDT", px: "97241.20", chg: 1.24 },
      { id: "ETHUSDT", px: "3521.80", chg: -0.62 },
      { id: "SOLUSDT", px: "178.45", chg: 3.11 },
      { id: "BNBUSDT", px: "612.30", chg: 0.44 },
      { id: "XRPUSDT", px: "2.184", chg: -1.08 },
      { id: "ADAUSDT", px: "0.842", chg: 0.91 },
      { id: "DOGEUSDT", px: "0.168", chg: -2.35 },
      { id: "AVAXUSDT", px: "38.12", chg: 1.77 },
      { id: "LINKUSDT", px: "18.40", chg: 0.28 },
      { id: "DOTUSDT", px: "6.21", chg: -0.54 }
    ];
    var watch = [];

    function loadWatch() {
      try { watch = JSON.parse(localStorage.getItem("watch") || "null") || ["BTCUSDT", "ETHUSDT", "SOLUSDT"]; }
      catch (e) { watch = ["BTCUSDT", "ETHUSDT", "SOLUSDT"]; }
    }
    function saveWatch() { localStorage.setItem("watch", JSON.stringify(watch)); }
    function isWatched(id) { return watch.indexOf(id) !== -1; }
    function toggleWatch(id) {
      if (isWatched(id)) watch = watch.filter(function (x) { return x !== id; });
      else watch.push(id);
      saveWatch();
      draw();
    }
    function findPair(id) {
      for (var i = 0; i < PAIRS.length; i++) if (PAIRS[i].id === id) return PAIRS[i];
      return null;
    }
    function fmt(n) { return (n > 0 ? "+" : "") + n.toFixed(2) + "%"; }
    function chgClass(n) { return n >= 0 ? "up" : "down"; }
    function rowHtml(p, withStar) {
      var star = withStar
        ? '<button type="button" class="star' + (isWatched(p.id) ? " on" : "") + '" data-star="' + p.id + '">' + (isWatched(p.id) ? "★" : "☆") + "</button>"
        : "";
      var cols = withStar
        ? star + "<span>" + p.id + "</span><span>" + p.px + "</span><span class='" + chgClass(p.chg) + "'>" + fmt(p.chg) + "</span>"
        : "<span>" + p.id.replace("USDT", "") + "</span><span class='" + chgClass(p.chg) + "'>" + fmt(p.chg) + "</span>";
      return '<a class="row" href="#pair/' + p.id + '">' + cols + "</a>";
    }
    function draw() {
      var q = (document.getElementById("search").value || "").trim().toUpperCase();
      if (!watch.length) {
        document.getElementById("watch").innerHTML = '<div class="empty">WATCHLIST EMPTY · ADD SYMBOL</div>';
      } else {
        document.getElementById("watch").innerHTML = watch.map(function (id) {
          var p = findPair(id);
          return p ? rowHtml(p, true) : "";
        }).join("");
      }
      var sorted = PAIRS.slice().sort(function (a, b) { return b.chg - a.chg; });
      document.getElementById("gainers").innerHTML = sorted.slice(0, 5).map(function (p) { return rowHtml(p, false); }).join("");
      document.getElementById("losers").innerHTML = sorted.slice(-5).reverse().map(function (p) { return rowHtml(p, false); }).join("");
      document.getElementById("list").innerHTML = PAIRS.filter(function (p) {
        return !q || p.id.indexOf(q) !== -1;
      }).map(function (p) { return rowHtml(p, true); }).join("") || '<p class="hint" style="padding:16px;">NO MATCH</p>';
    }
    function loadWatch() {
      try { watch = JSON.parse(localStorage.getItem("watch") || "null") || ["BTCUSDT", "ETHUSDT", "SOLUSDT"]; }
      catch (e) { watch = ["BTCUSDT", "ETHUSDT", "SOLUSDT"]; }
    }
    function saveWatch() { localStorage.setItem("watch", JSON.stringify(watch)); }
    function isWatched(id) { return watch.indexOf(id) !== -1; }
    function toggleWatch(id) {
      if (isWatched(id)) watch = watch.filter(function (x) { return x !== id; });
      else watch.push(id);
      saveWatch();
      draw();
    }
    function findPair(id) {
      for (var i = 0; i < PAIRS.length; i++) if (PAIRS[i].id === id) return PAIRS[i];
      return null;
    }
    function fmt(n) { return (n > 0 ? "+" : "") + n.toFixed(2) + "%"; }
    function chgClass(n) { return n >= 0 ? "up" : "down"; }

    document.addEventListener("click", function (e) {
      var btn = e.target.closest("[data-star]");
      if (!btn) return;
      e.preventDefault();
      e.stopPropagation();
      toggleWatch(btn.getAttribute("data-star"));
    });
    document.getElementById("search").addEventListener("input", draw);
    window.addEventListener("hashchange", function () {
      var hash = location.hash || "#markets";
      if (hash.indexOf("#pair") === 0) {
        show("pair");
        document.getElementById("pairTitle").textContent = hash.split("/")[1] || "BTCUSDT";
      } else if (hash === "#access") show("access");
      else show("markets");
    });

    var watch = [];
    loadWatch();
    draw();
    if (!location.hash) show("markets");
    else window.dispatchEvent(new Event("hashchange"));
  </script>
</body>
</html>
